<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>A Date? 💕</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffd6e7,#fff0f6,#ffe1ee);display:flex;justify-content:center;align-items:center;overflow:hidden;color:#5b1834}.card{width:min(92%,620px);background:rgba(255,255,255,.9);border-radius:28px;padding:42px 30px;text-align:center;box-shadow:0 20px 60px rgba(140,40,90,.18);position:relative;z-index:2}h1{font-size:clamp(30px,6vw,48px);margin:0 0 14px}.sub{font-size:18px;margin-bottom:28px;color:#7d3a55}.buttons{display:flex;justify-content:center;gap:18px;position:relative;min-height:58px}button{border:0;border-radius:999px;padding:15px 30px;font-size:18px;font-weight:700;cursor:pointer;transition:.2s}#yes{background:#ff4f91;color:white;box-shadow:0 8px 20px rgba(255,79,145,.3)}#yes:hover{transform:scale(1.05)}#no{background:#eee;color:#555;position:relative}.hidden{display:none}.question{font-size:30px;margin-bottom:25px}.field{text-align:left;margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:7px}input,select,textarea{width:100%;padding:13px 14px;border:1px solid #e4bfd0;border-radius:14px;font-size:16px;font-family:inherit;background:#fff}textarea{min-height:110px;resize:vertical}.submit{width:100%;margin-top:8px;background:#ff4f91;color:#fff}.heart{position:fixed;bottom:-30px;font-size:22px;animation:float 8s linear infinite;opacity:.65;z-index:1}@keyframes float{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.65}100%{transform:translateY(-115vh) rotate(360deg);opacity:0}}</style></head><body><div class="card" id="mainCard"><section id="questionPage"><div style="font-size:55px">💖</div><h1>Would you like to go on a date with me?</h1><div class="sub">Choose wisely… there is only one correct answer 😌💕</div><div class="buttons"><button id="yes" type="button">YES 💕</button><button id="no" type="button">NO 😭</button></div></section><section id="formPage" class="hidden"><div class="question">Okayyy! Tell me everything 💕</div><form action="https://formsubmit.co/haxawa" method="POST"><input type="hidden" name="_subject" value="💕 NEW DATE RESPONSE!"><input type="hidden" name="_template" value="table"><input type="hidden" name="_captcha" value="false"><input type="hidden" name="_next" value="https://mohamedmelegy371-lgtm.github.io/date-for-u/thanks.html"><div class="field"><label for="date">When would you like our date?</label><input id="date" type="date" name="Date" required></div><div class="field"><label for="type">What kind of date?</label><select id="type" name="Date Type" required><option value="">Choose one 💗</option><option>Dinner 🍝</option><option>Coffee ☕</option><option>Movie 🎬</option><option>Walk 🌙</option><option>Surprise ✨</option></select></div><div class="field"><label for="place">Where is your dream place?</label><input id="place" type="text" name="Dream Place" placeholder="Anywhere with you..." required></div><div class="field"><label for="message">Anything you want to tell me? 💌</label><textarea id="message" name="Message" placeholder="Write something cute..."></textarea></div><button class="submit" type="submit">SEND MY ANSWERS 💌</button></form></section></div><script>const no=document.getElementById('no'),yes=document.getElementById('yes'),questionPage=document.getElementById('questionPage'),formPage=document.getElementById('formPage');function runAway(){no.style.position='fixed';no.style.left=Math.min(innerWidth-120,Math.max(10,innerWidth/2+(Math.random()*260-130)))+'px';no.style.top=Math.min(innerHeight-60,Math.max(10,innerHeight/2+(Math.random()*180-90)))+'px'}no.addEventListener('mouseenter',runAway);no.addEventListener('touchstart',e=>{e.preventDefault();runAway()});no.addEventListener('click',runAway);yes.addEventListener('click',()=>{questionPage.classList.add('hidden');formPage.classList.remove('hidden')});for(let i=0;i<18;i++){const h=document.createElement('div');h.className='heart';h.textContent=['💗','💕','💖','💘'][Math.floor(Math.random()*4)];h.style.left=Math.random()*100+'vw';h.style.animationDelay=Math.random()*7+'s';h.style.animationDuration=6+Math.random()*6+'s';document.body.appendChild(h)}</script></body></html>
